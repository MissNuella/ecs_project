server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    return 200 "ok";
  }

  # Local development only: in AWS the ALB sends /api/* straight to the API service.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://${API_HOST}:3000;
    proxy_pass $api_upstream;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
